runtime: python311
instance_class: F1

automatic_scaling:
  min_instances: 0
  max_instances: 2
  target_cpu_utilization: 0.65

entrypoint: gunicorn -w 2 -k uvicorn.workers.UvicornWorker -b :$PORT main:app

handlers:
  - url: /assests
    static_dir: assests

  - url: /.*
    script: auto
    secure: always

env_variables:
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "adminjade2026"
  ADMIN_SESSION_SECRET: "jade_coatings_secret_session_key_2026_super_secure_token"
